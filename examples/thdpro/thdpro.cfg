# THD ProScan v1.0.0 — Sample Configuration
# Preconfigured for ClamAV on Linux
#
# Copy to same directory as THDPRO executable.
# Edit paths to match your system.

# Working directory for temp file extraction
WORKDIR=/tmp/thdpro

# Log file path and max size (bytes, 0=no logging)
LOGFILE=/var/log/thdpro.log
MAXLOGSIZE=1048576

# BBS data directory (FILES.BBS location)
BBSDIR=/mystic/files/

# Virus scanner — ClamAV (recommended for modern systems)
# Install: apt install clamav  /  pkg install clamav
# Update:  freshclam
SCANNER=CLAMAV
SCANNERPATH=/usr/bin/clamscan

# Archive tools (for testing archives before accepting uploads)
UNZIP=/usr/bin/unzip
UNRAR=/usr/bin/unrar
ARJ=
LHA=

# Options
MAXFILESIZE=10485760
MAXDESCSIZE=1500
SECUREMODE=YES
HEURISTICFAIL=NO
